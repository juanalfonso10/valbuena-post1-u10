# sonar-project.properties
# Configuracion del analisis de SonarQube para envios-service.
# Nota: SonarScanner for Maven (mvn sonar:sonar) no lee este archivo; toma la
# configuracion del pom.xml, donde estas mismas propiedades estan replicadas.
# Este archivo es el que usaria el SonarScanner CLI (sonar-scanner) y documenta
# la configuracion en un solo lugar.

# Identificador unico del proyecto en el servidor y nombre visible en el dashboard
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Codigo de produccion y codigo de pruebas (las pruebas no cuentan para la cobertura)
sonar.sources=src/main/java
sonar.tests=src/test/java

# Bytecode compilado: el analizador de Java lo necesita para resolver tipos
sonar.java.binaries=target/classes

# Reporte XML que genera JaCoCo en la fase verify (mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor SonarQube local levantado con Docker (Decision de diseno 1)
sonar.host.url=http://localhost:9000

# No bloquear la ejecucion esperando el resultado del Quality Gate
sonar.qualitygate.wait=false

# Exclusiones (Decision de diseno 2): no se excluye ninguna clase. El proyecto no
# tiene clase de arranque (Main) ni codigo generado; todo src/main/java es logica
# de negocio, asi que excluir algo solo maquillaria la cobertura.
# sonar.exclusions=
